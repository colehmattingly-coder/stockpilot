<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockPilot</title>
  <meta name="description" content="Look up any stock and get a plain-English read on the market, its support levels, and what to do next.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="#/overview" aria-label="StockPilot home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-6 4 3 6-8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="6" r="2.2" fill="currentColor"/></svg>
        StockPilot
      </a>
      <form id="search" class="search" role="search">
        <label for="q" class="sr-only">Look up a stock</label>
        <input id="q" name="q" placeholder="Look up a ticker, e.g. AAPL" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="10">
        <button type="submit">Analyze</button>
      </form>
      <nav aria-label="Main">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/stocks" data-route="stocks">My stocks</a>
        <a href="#/market" data-route="market">Market</a>
        <a href="#/accuracy" data-route="accuracy">Track record</a>
        <a href="#/settings" data-route="settings">Settings</a>
      </nav>
    </div>
    <div id="status" class="status"></div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <p>StockPilot is a class project. It is rule-based, educational, and not investment advice.
    See the <a href="#/accuracy">track record</a> for how its signals performed over 5 years.</p>
  </footer>

  <script src="js/data.js?v=2"></script>
  <script src="js/engine.js?v=2"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
