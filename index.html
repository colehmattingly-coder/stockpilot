<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockPilot</title>
  <meta name="description" content="Portfolio tracker with market-sentiment rundowns and support-based plans of attack.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/dashboard"><span class="logo">▲</span> StockPilot</a>
    <nav>
      <a href="#/dashboard" data-route="dashboard">Dashboard</a>
      <a href="#/portfolio" data-route="portfolio">Portfolio</a>
      <a href="#/market" data-route="market">Market</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
    <div class="topbar-right">
      <span id="mode-pill" class="pill"></span>
      <button id="refresh" class="btn btn-ghost" title="Refresh prices">↻ Refresh</button>
    </div>
  </header>

  <div id="banner"></div>
  <main id="app"></main>

  <footer class="footer">
    StockPilot is a class project for educational purposes only — not investment advice.
    Levels and plans are generated by simple rules from public market data.
  </footer>

  <script src="js/demo.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
